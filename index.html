  }

    display:flex; flex-direction:column;
    min-height: 660px; max-height: 88vh; position:relative;

  .header-avatar{ width:42px; height:42px; border-radius:50%; background: linear-gradient(135deg, var(--teal), #1c7f74); display:flex; align-items:center; justify-content:center; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:13px; color:var(--ink); flex-shrink:0; }
  .header-text{ line-height:1.25; }
  .header-title{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:16.5px; }

  .progress-row{ display:flex; gap:5px; padding:10px 18px 12px; background:var(--ink-2); }
  .dot{ flex:1; height:4px; border-radius:3px; background:rgba(255,255,255,0.12); overflow:hidden; }
  .dot span{ display:block; height:100%; width:0%; background:var(--teal); transition:width .4s ease; }
  .dot.done span{ width:100%; }
  .dot.current span{ width:100%; background:var(--bubble-user); }

  .chat-log{ flex:1; overflow-y:auto; padding:18px 16px 10px; display:flex; flex-direction:column; gap:10px; scroll-behavior:smooth; }

  .chat-log::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.15); border-radius:6px; }

  .row{ display:flex; width:100%; animation: rise .35s ease both; }
  .row.bot{ justify-content:flex-start; }
  .row.user{ justify-content:flex-end; }
  @keyframes rise{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  .bot-wrap{ display:flex; gap:8px; align-items:flex-end; max-width:88%; }

  .bubble{ max-width:78%; padding:11px 14px; font-size:14.5px; line-height:1.42; font-weight:500; }
  .bubble.bot{ background:var(--bubble-bot); color:var(--text-light); border-radius:4px 12px 12px 12px; }
  .bubble.user{ background:var(--bubble-user); color:var(--bubble-user-text); border-radius:12px 4px 12px 12px; font-weight:600; }

  .typing-row{ display:flex; gap:8px; align-items:flex-end; }
  .typing-bubble{ background:var(--bubble-bot); padding:12px 16px; border-radius:4px 12px 12px 12px; display:flex; gap:4px; align-items:center; }

  .typing-bubble i:nth-child(3){ animation-delay:.3s; }

  .chips{ display:flex; flex-direction:column; gap:8px; padding:2px 4px 6px 32px; animation: rise .35s ease both; }
  .chip{ text-align:left; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.14); color:var(--text-light); padding:11px 14px; border-radius:12px; font-family:'Inter',sans-serif; font-size:14px; font-weight:500; cursor:pointer; transition: background .15s ease, border-color .15s ease, transform .1s ease; }

  .chip:active{ transform:scale(0.98); }
  .chip:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }
  .chip.start{ background:var(--bubble-user); color:var(--bubble-user-text); border-color:var(--bubble-user); font-weight:700; text-align:center; font-family:'Baloo 2',sans-serif; font-size:15px; }

  .sheet-backdrop.show{ opacity:1; pointer-events:all; }

  .sheet{ width:100%; background:var(--card-white); border-radius:26px 26px 0 0; transform:translateY(100%); transition: transform .45s cubic-bezier(.2,.9,.25,1); position:relative; max-height:94%; overflow-y:auto; }

  .sheet-handle{ width:38px; height:4px; border-radius:3px; background:rgba(255,255,255,0.5); margin:8px auto 0; position:relative; z-index:2; }

  .card-top{
    background: linear-gradient(135deg, var(--navy), var(--navy-2));

  .badge-text{ line-height:1.2; }

  .avatar-wrap{ display:flex; justify-content:center; margin-top:-38px; }

  .card-founder{ text-align:center; font-size:13px; color:#5b5470; margin-top:2px; }

  .sector-pill{ display:block; width:fit-content; margin: 12px auto 0; background:var(--green-soft); color:#3a6b25; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:12px; padding:5px 14px; border-radius:20px; }

  .card-divider{ height:1px; background:rgba(27,16,53,0.1); margin:16px 0; }

  .card-blurb{ font-size:14.5px; line-height:1.55; text-align:center; color:#3a2c50; }

  .card-meta{ display:flex; justify-content:center; gap:18px; margin-top:16px; font-size:11.5px; color:#8b84a0; }

  .btn{ border:none; border-radius:14px; padding:13px 16px; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15px; cursor:pointer; text-align:center; text-decoration:none; display:block; }

  .btn-primary:hover{ background:var(--navy-2); }
  .btn-outline{ background:transparent; color:var(--navy); border:1.5px solid rgba(22,32,90,0.25); }
  .btn-outline:hover{ background:rgba(22,32,90,0.06); }
  .btn-secondary{ background:transparent; color:#3a2c50; border:1.5px solid rgba(27,16,53,0.15); }
  .btn:focus-visible{ outline:2px solid var(--green); outline-offset:2px; }

  .retake{ text-align:center; margin-top:14px; padding-bottom:6px; font-size:12.5px; color:#8b84a0; text-decoration:underline; cursor:pointer; background:none; border:none; font-family:inherit; width:100%; }

  .toast.show{ opacity:1; transform:translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>

  { q:"Pick the founder story you'd want to hear over chai:",
    opts:[
      {t:"Built something in a garage that now protects networks", tag:"SECURITY"},
      {t:"Left a job for a wild UAV idea", tag:"AUTO"},
      {t:"Started teaching AI to school kids in Kannada", tag:"EDU"},
      {t:"Turned a hyperlocal idea into a whole platform", tag:"LOCAL"}
    ]}
];

/* ================= STATE ================= */
let scores = {}; Object.keys(TAG_LABELS).forEach(k=>scores[k]=0);
let matchList = [];
let matchIdx = 0;

const chatLog = document.getElementById('chatLog');
const progressRow = document.getElementById('progressRow');
const fakeInputText = document.getElementById('fakeInputText');
const headerSub = document.getElementById('headerSub');

questions.forEach((_, i)=>{
  const d = document.createElement('div');
  d.className='dot'; d.id='dot'+i; d.innerHTML='<span></span>';
  progressRow.appendChild(d);
});

function scrollDown(){ requestAnimationFrame(()=>{ chatLog.scrollTop = chatLog.scrollHeight; }); }

function addBotBubble(text){
  const row=document.createElement('div'); row.className='row bot';
  row.innerHTML=`<div class="bot-wrap"><div class="bot-mini">🍃</div><div class="bubble bot">${text}</div></div>`;
  chatLog.appendChild(row); scrollDown();
}
function addUserBubble(text){
  const row=document.createElement('div'); row.className='row user';
  row.innerHTML=`<div class="bubble user">${text}</div>`;
  chatLog.appendChild(row); scrollDown();
}
function addTyping(cb, delay=650){
  const row=document.createElement('div'); row.className='row bot typing-row'; row.id='typingRow';
  row.innerHTML=`<div class="bot-mini">🍃</div><div class="typing-bubble"><i></i><i></i><i></i></div>`;
  chatLog.appendChild(row); scrollDown();
  setTimeout(()=>{ const t=document.getElementById('typingRow'); if(t) t.remove(); cb(); }, delay);
}
function renderChips(options, onPick, startMode=false){
  const wrap=document.createElement('div'); wrap.className='chips';
  options.forEach(opt=>{
    const b=document.createElement('button');
    b.className='chip'+(startMode?' start':'');
    b.textContent=opt.label;
    b.onclick=()=>{
      wrap.querySelectorAll('.chip').forEach(c=>c.disabled=true);
      wrap.style.opacity='0.35'; wrap.style.pointerEvents='none';
      onPick(opt);
    };
    wrap.appendChild(b);
  });
  chatLog.appendChild(wrap); scrollDown();
}

function startQuiz(){
  addBotBubble("Hi! I'm here to match you with your BeTCA twin — the Belagavi tech company most like you. A few quick questions, then I'll introduce you 👋");
  setTimeout(()=>{
    renderChips([{label:"Find my twin →"}], ()=>{
      addUserBubble("Find my twin →");
      addTyping(()=>askQuestion(0));
    }, true);
  }, 400);
}

function askQuestion(i){
  document.getElementById('dot'+i).classList.add('current');
  headerSub.textContent = `Question ${i+1} of ${questions.length}`;
  const q = questions[i];
  addBotBubble(q.q);
  setTimeout(()=>{
    renderChips(q.opts.map(o=>({label:o.t})), (picked)=>{
      const chosen = q.opts.find(o=>o.t===picked.label);
      addUserBubble(chosen.t);
      scores[chosen.tag] += 1;
      document.getElementById('dot'+i).classList.remove('current');
      document.getElementById('dot'+i).classList.add('done');
      addTyping(()=>{
        if(i+1 < questions.length) askQuestion(i+1);
        else finishQuiz();
      });
    });
  }, 350);
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function finishQuiz(){
  headerSub.textContent = "Calculating your twin…";
  fakeInputText.textContent = "Result ready ↓";
  addBotBubble("Alright, that's everything I need 🎉 Let me find your twin among all 35 companies…");
  setTimeout(()=>{
    addTyping(()=>{
      const scored = shuffle(companies.slice()).map(c=>({
        c, score: scores[c.tag1] + scores[c.tag2]
      })).sort((a,b)=> b.score - a.score);
      matchList = scored.slice(0, 8).map(s=>s.c);
      matchIdx = 0;
      showResult();
    }, 900);
  }, 400);
}

function showResult(){
  const c = matchList[matchIdx];
  document.getElementById('resAvatar').textContent = c.emoji;
  document.getElementById('resName').textContent = c.name;
  document.getElementById('resFounder').textContent = c.founder;
  document.getElementById('resSector').textContent = c.sector;
  document.getElementById('resBlurb').textContent = c.blurb;
  document.getElementById('resMatchNum').textContent = matchIdx+1;
  document.getElementById('resMatchTotal').textContent = matchList.length;
  document.getElementById('sheetBackdrop').classList.add('show');

  document.getElementById('shareBtn').onclick = ()=>{
    const shareText = `My BeTCA twin is ${c.name} (${c.sector})! Find yours at Tech Meet 2026 🎉 #TechMeet2026 #Belagavi`;
    if(navigator.share){ navigator.share({text: shareText}).catch(()=>{}); }
    else{
      navigator.clipboard.writeText(shareText).then(()=>{
        const toast=document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(()=>toast.classList.remove('show'), 2200);
      });
    }
  };
}

document.getElementById('anotherBtn').onclick = ()=>{
  matchIdx = (matchIdx + 1) % matchList.length;
  showResult();
};

document.getElementById('retakeBtn').onclick = ()=>{
  document.getElementById('sheetBackdrop').classList.remove('show');
  chatLog.innerHTML=''; scores={}; Object.keys(TAG_LABELS).forEach(k=>scores[k]=0);
  matchList=[]; matchIdx=0;
  document.querySelectorAll('.dot').forEach(d=>d.classList.remove('done','current'));
  headerSub.textContent = "35 companies · Tech Meet 2026";
  fakeInputText.textContent = "Tap an option above to reply";
  setTimeout(startQuiz, 200);
};

startQuiz();
</script>

</body>
</html>
